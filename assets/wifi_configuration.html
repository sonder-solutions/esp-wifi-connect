<!DOCTYPE html>
<html>
<head>
    <title>Momo WiFi Setup</title>
    <meta charset="utf-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style type="text/css">
        /* ========== Design Tokens ========== */
        :root {
            --accent: #52bcff;
            --accent-hover: #3aa5e8;
            --accent-soft: rgba(82, 188, 255, 0.12);
            --bg-grad-1: #f0f8ff;
            --bg-grad-2: #e6f2ff;
            --surface: rgba(255, 255, 255, 0.7);
            --surface-muted: rgba(240, 248, 255, 0.2);
            --border: rgba(121, 194, 240, 0.4);
            --border-strong: rgba(121, 194, 240, 0.6);
            --text: #2B2120;
            --text-muted: #8a7573;
            --danger: #dc2626;
            --success: #16a34a;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 8px 24px rgba(43, 33, 32, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --accent: #52bcff;
                --accent-hover: #7accff;
                --accent-soft: rgba(82, 188, 255, 0.16);
                --bg-grad-1: #1a1211;
                --bg-grad-2: #251a18;
                --surface: rgba(43, 33, 32, 0.7);
                --surface-muted: rgba(53, 42, 40, 0.2);
                --border: rgba(82, 188, 255, 0.4);
                --border-strong: rgba(82, 188, 255, 0.6);
                --text: #f5e8e6;
                --text-muted: #b8a5a3;
                --danger: #f87171;
                --success: #4ade80;
            }
        }

        /* ========== Mobile Responsive ========== */
        @media (max-width: 480px) {
            .page {
                max-width: 100%;
                width: 100%;
                margin: 0;
                padding: 0;
            }
            .app-header {
                margin-bottom: 0;
            }
            .card {
                border-radius: 0;
                width: 100vw;
                border: none;
                box-shadow: none;
                margin: 0;
            }
        }

        /* ========== Base Styles ========== */
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            min-height: 100%;
        }

        .page {
            max-width: 460px;
            margin: 0 auto;
            padding-top: 16px;
            display: flex;
            flex-direction: column;
        }

        /* ========== Header ========== */
        .app-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .app-header .logo {
            width: 32px;
            height: 32px;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9px;
            background: var(--accent);
            color: #fff;
            box-shadow: var(--shadow);
        }
        .app-header .logo svg { width: 19px; height: 19px; }

        /* ========== Language Switcher ========== */
        .language-switch {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }
        .language-switch svg {
            width: 18px;
            height: 18px;
            flex: none;
            background-color:rgba(150,150,150,0.4);
            border-radius:50%;
        }
        .language-switch svg path,
        .language-switch svg circle,
        .language-switch svg line {
            stroke: var(--surface);
            stroke-width: 2.2 ;
            mix-blend-mode: plus-lighter;
        }
        .language-switch select {
            width: auto;
            padding: 7px 10px;
            font-size: 13px;
            background: var(--surface-muted);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            cursor: pointer;
        }

        /* ========== Card ========== */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            min-height: 600px;
            display: flex;
            flex-direction: column;
        }

        /* ========== Momo Face SVG ========== */
        .momo-container {
            padding: 8px;
            text-align: center;
            background: var(--surface-muted);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 20px;
            position: relative;
        }
        svg#momoFace {
            width: 180px;
            height: 180px;
            margin: 0;
            display: block;
            flex-shrink: 0;
        }
        .dialogue-bubble {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 8px 12px;
            max-width: 280px;
            text-align: left;
            position: relative;
            box-shadow: var(--shadow);
            font-size: 15px;
            line-height: 1.5;
            color: var(--text);
            min-height: 60px;
            display: flex;
            align-items: center;
        }
        .dialogue-bubble::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 50%;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-right: 12px solid var(--border);
        }
        .dialogue-bubble::after {
            content: '';
            position: absolute;
            left: -9px;
            top: 50%;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-right: 10px solid var(--surface);
        }

        /* ========== Dialog Area ========== */
        .dialog-area {
            flex: 1;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            max-height: 400px;
            background: var(--surface);
        }
        .dialog-text {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.5;
            margin: 0 0 24px;
            min-height: 60px;
            color: var(--text);
            text-align: center;
        }

        /* ========== Options/Buttons ========== */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .option-btn {
            width: 100%;
            background: var(--surface-muted);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            font-size: 15px;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
            transition: all 0.15s;
            text-align: left;
        }
        .option-btn:hover {
            border-color: var(--accent);
            background: var(--accent-soft);
        }
        .option-btn:active {
            transform: translateY(1px);
        }
        .option-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .option-btn.primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        .option-btn.danger {
            color: var(--danger);
            border-color: var(--danger);
        }
        .option-btn.danger:hover {
            background: rgba(220, 38, 38, 0.1);
        }
        .option-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ========== Network List ========== */
        .network-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 16px;
        }
        .network-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: var(--surface-muted);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.15s;
        }
        .network-item:hover {
            border-color: var(--accent);
            background: var(--accent-soft);
        }
        .network-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .network-name {
            font-weight: 500;
            font-size: 15px;
        }
        .network-signal {
            font-size: 12px;
            color: var(--text-muted);
        }
        .network-icon {
            font-size: 18px;
        }

        /* ========== Saved WiFi List ========== */
        .saved-wifi-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }
        .saved-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 16px;
            background: var(--surface-muted);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 500;
            transition: all 0.15s;
        }
        .saved-item:hover {
            border-color: var(--accent);
            background: var(--accent-soft);
        }
        .saved-item span {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ========== Form Inputs ========== */
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }
        .input-group input,
        .input-group select {
            width: 100%;
            padding: 11px 12px;
            font-size: 15px;
            color: var(--text);
            background: var(--surface-muted);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .input-group input:focus,
        .input-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        /* ========== Error Message ========== */
        .error-message {
            color: var(--danger);
            font-size: 14px;
            text-align: center;
            margin: 12px 0;
        }

        /* ========== Toast Message ========== */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            background: rgba(15, 23, 42, 0.92);
            color: #fff;
            padding: 13px 22px;
            border-radius: 12px;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            font-size: 14px;
            box-shadow: var(--shadow);
            max-width: 90vw;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ========== Advanced Toggle ========== */
        .advanced-link {
            text-align: center;
            margin-top: 12px;
        }
        .advanced-link a {
            color: var(--accent);
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
        }
        .advanced-link a:hover {
            text-decoration: underline;
        }

        /* ========== Checkbox ========== */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: var(--surface-muted);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
        }
        .checkbox-group label {
            margin: 0;
            color: var(--text);
            font-weight: 500;
            flex: 1;
        }
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        /* ========== Scanning Indicator ========== */
        .scanning {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px;
            color: var(--text-muted);
            font-size: 14px;
        }
        .scanning::before {
            content: "";
            width: 16px;
            height: 16px;
            border: 2px solid var(--border-strong);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* ========== Fade In Animation ========== */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeInUp {
            from {

            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .fade-in-up {
            animation: fadeInUp 0.5s ease-out;
        }

                d += ` M${(x-r).toFixed(2)},${y.toFixed(2)} a${r.toFixed(2)},${r.toFixed(2)} 0 1 0 ${(2*r).toFixed(2)},0 a${r.toFixed(2)},${r.toFixed(2)} 0 1 0 ${(-2*r).toFixed(2)},0 Z`;
            }
            return d;
        }

        function drawFeature(group, feature, visibility = 1) {
            group.dataset.kind = feature.kind;
            group.style.opacity = clamp(feature.alpha * visibility, 0, 1);
            if (feature.raw) {
                if (group.dataset.raw !== feature.raw) {
                    group.innerHTML = feature.raw;
                    group.dataset.raw = feature.raw;
                }
            } else {
                if (group.dataset.raw !== 'polygon') {
                    group.innerHTML = '<path fill-rule="evenodd"></path>';
                    group.dataset.raw = 'polygon';
                }
                group.firstElementChild.setAttribute('d', pathFor(feature));
                group.firstElementChild.setAttribute('fill', feature.color);
            }
        }

        function render(frame) {
            byId('face').setAttribute('fill', frame.head);
            const radians = frame.angle * Math.PI / 180;
            const dx = frame.radius * Math.sin(radians), dy = frame.radius * Math.cos(radians) + frame.offset;
            for (const [id, x] of [['cheekL', CX - dx], ['cheekR', CX + dx]]) {
                byId(id).setAttribute('cx', x);
                byId(id).setAttribute('cy', CY + dy);
            }
            byId('cheeks').style.opacity = clamp(frame.cheeks, 0, 1);

            const track = frame.eyeTrack, y = 43.78 * track;
            const eyeTX = (side) => side === 'left' ? -28 * track : 28 * track;
            const eyeCX = { left: 140.5, right: 350.0 };
            const eyeCY = 245.3;

            // Star eyes are ordinary eye features (the eye graph morphs Round into Star).
            for (const [id, side] of [['eyeL', 'left'], ['eyeR', 'right']]) {
                byId(id).setAttribute('transform', `translate(${eyeTX(side)} ${y})`);
            }

            drawFeature(byId('eyeL'), frame.left);
            drawFeature(byId('eyeR'), frame.right);

            if (frame.mode === 'loading' && frame.left.kind === 'Roll') {
                ensureLoadingOrbit();
                const angle = loadingOrbitAngle();
                const rollCX = { left: 146.6, right: 356.1 };
                const rollCY = 235.8;
                for (const [id, side] of [['eyeL', 'left'], ['eyeR', 'right']]) {
                    const cx = rollCX[side], cy = rollCY;
                    byId(id).setAttribute('transform',
                        `translate(${eyeTX(side)} ${y}) rotate(${angle} ${cx} ${cy})`);
                }
            } else {
                stopLoadingOrbit(false);
            }

            const blinkScaleLeft = frame.blinkScaleLeft != null ? frame.blinkScaleLeft : 1;
            const blinkScaleRight = frame.blinkScaleRight != null ? frame.blinkScaleRight : 1;
            if (blinkScaleLeft < 0.99) {
                const cx = eyeCX['left'], cy = eyeCY;
                const currentTransform = byId('eyeL').getAttribute('transform');
                byId('eyeL').setAttribute('transform',
                    `${currentTransform} translate(${cx} ${cy}) scale(1 ${blinkScaleLeft}) translate(${-cx} ${-cy})`);
            }
            if (blinkScaleRight < 0.99) {
                const cx = eyeCX['right'], cy = eyeCY;
                const currentTransform = byId('eyeR').getAttribute('transform');
                byId('eyeR').setAttribute('transform',
                    `${currentTransform} translate(${cx} ${cy}) scale(1 ${blinkScaleRight}) translate(${-cx} ${-cy})`);
            }

            drawFeature(byId('mouth'), frame.mouth);

            for (const key of Object.keys(accessoryLabels)) {
                const alpha = clamp(frame.accessories[key], 0, 1);
                const node = document.querySelector(`#frontAccessories g:nth-child(${Object.keys(accessoryLabels).indexOf(key) + 1})`);
                if (node) {
                    if (alpha < 0.05) {
                        node.style.opacity = 0;
                        node.style.display = 'none';
                    } else {
                        node.style.opacity = alpha;
                        node.style.display = '';
                    }
                }
            }
        }

        const easings = {
            linear: t => t,
            easeInOut: t => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t,
        };

        function cancelAnimation() {
            if (self.morphAnimationId !== null) cancelAnimationFrame(self.morphAnimationId);
            self.morphAnimationId = null;
        }

        function animateTo(to, done) {
            cancelAnimation();
            render(self.currentFrame);
            const from = clone(self.currentFrame), target = clone(to);
            const leftRoute = route(eyeGraph, from.left.kind, target.left.kind);
            const rightRoute = route(eyeGraph, from.right.kind, target.right.kind);
            const mouthRoute = route(mouthGraph, from.mouth.kind, target.mouth.kind);
            const steps = Math.max(leftRoute.length + 1, rightRoute.length + 1, mouthRoute.length + 1, 1);
            const duration = steps * STEP_DURATION;
            const ease = easings.easeInOut;
            const started = performance.now();

            function step(now) {
                const time = clamp((now - started) / duration, 0, 1), t = clamp(ease(time), 0, 1);
                self.currentFrame = {
                    left: onRoute(from.left, target.left, leftRoute, t, k => eyeFor(k, 'left')),
                    right: onRoute(from.right, target.right, rightRoute, t, k => eyeFor(k, 'right')),
                    mouth: onRoute(from.mouth, target.mouth, mouthRoute, t, mouthFor),
                    head: colorMix(from.head, target.head, t), cheeks: lerp(from.cheeks, target.cheeks, t),
                    accessories: {}, angle: lerp(from.angle, target.angle, t), offset: lerp(from.offset, target.offset, t),
                    radius: lerp(from.radius, target.radius, t), eyeTrack: lerp(from.eyeTrack, target.eyeTrack, t),
                    mode: t < 0.5 ? (from.mode || 'eye') : (target.mode || 'eye'),
                    emotion: target.emotion,
                    blinkScaleLeft: lerp(from.blinkScaleLeft || 1, target.blinkScaleLeft || 1, t),
                    blinkScaleRight: lerp(from.blinkScaleRight || 1, target.blinkScaleRight || 1, t)
                };
                for (const key of Object.keys(accessoryLabels)) self.currentFrame.accessories[key] = lerp(from.accessories[key], target.accessories[key], t);
                render(self.currentFrame);
                if (time < 1) self.morphAnimationId = requestAnimationFrame(step);
                else {
                    self.morphAnimationId = null;
                    self.currentFrame = target;
                    render(target);
                    if (done) done();
                }
            }
            self.morphAnimationId = requestAnimationFrame(step);
        }

        function loadingOrbitAngle() {
            if (!self.loadingOrbitT0) self.loadingOrbitT0 = performance.now();
            const u = ((performance.now() - self.loadingOrbitT0) / 1000 % 2.4) / 2.4;
            return u < 0.75 ? (u / 0.75) * 360 : 360;
        }

        function ensureLoadingOrbit() {
            if (self.loadingOrbitRaf || self.morphAnimationId !== null) return;
            if (!self.loadingOrbitT0) self.loadingOrbitT0 = performance.now();
            const tick = () => {
                if (!self.currentFrame || self.currentFrame.mode !== 'loading' || self.morphAnimationId !== null) {
                    self.loadingOrbitRaf = null;
                    return;
                }
                render(self.currentFrame);
                self.loadingOrbitRaf = requestAnimationFrame(tick);
            };
            self.loadingOrbitRaf = requestAnimationFrame(tick);
        }

        function stopLoadingOrbit(resetPhase = false) {
            if (self.loadingOrbitRaf) {
                cancelAnimationFrame(self.loadingOrbitRaf);
                self.loadingOrbitRaf = null;
            }
            if (resetPhase) {
                self.loadingOrbitT0 = 0;
            }
        }

        // Initialize
        this.currentFrame = pose('speaking');
        render(this.currentFrame);

        // Public API
        this.setEmotion = function(emotion) {
            const next = pose(emotion);
            animateTo(next);
        };

        this.blink = function() {
            const duration = 150;
            const started = performance.now();

            function step(now) {
                const elapsed = now - started;
                const progress = Math.min(elapsed / duration, 1);
                let blinkScale;
                if (progress < 0.5) {
                    blinkScale = 1 - (progress / 0.5);
                } else {
                    blinkScale = (progress - 0.5) / 0.5;
                }
                self.currentFrame.blinkScaleLeft = blinkScale;
                self.currentFrame.blinkScaleRight = blinkScale;
                render(self.currentFrame);
                if (progress < 1) requestAnimationFrame(step);
                else {
                    self.currentFrame.blinkScaleLeft = 1;
                    self.currentFrame.blinkScaleRight = 1;
                    render(self.currentFrame);
                }
            }
            requestAnimationFrame(step);
        };
    }
}

// ========== State Machine ==========
const STATE = {
    MAIN_MENU: 'MAIN_MENU',
    SCANNING: 'SCANNING',
    SELECT_NETWORK: 'SELECT_NETWORK',
    CONFIRM_CONNECT: 'CONFIRM_CONNECT',
    ENTER_PASSWORD: 'ENTER_PASSWORD',
    CONNECTING: 'CONNECTING',
    SUCCESS: 'SUCCESS',
    FAILED: 'FAILED',
    SAVED_LIST_DELETE: 'SAVED_LIST_DELETE',
    SAVED_LIST_DEFAULT: 'SAVED_LIST_DEFAULT',
    CONFIRM_DELETE: 'CONFIRM_DELETE',
    ADVANCED: 'ADVANCED'
};

let currentState = STATE.MAIN_MENU;
let selectedNetwork = null;
let selectedNetworkAuth = 0;
let deleteIndex = null;
let support5G = false;
let momoFace = null;
let savedNetworks = [];
let apList = [];
let refreshInterval = null;
let advancedRenderId = 0;

// Values are esp_wifi_set_max_tx_power() units (0.25 dBm)
const TX_POWER_OPTIONS = [
    [8, '2 dBm'], [20, '5 dBm'], [28, '7 dBm'], [34, '8 dBm'], [44, '11 dBm'], [52, '13 dBm'],
    [56, '14 dBm'], [60, '15 dBm'], [66, '16 dBm'], [72, '18 dBm'], [80, '20 dBm']
];

// ========== Global References ==========
const dialogArea = document.getElementById('dialogArea');
const toast = document.getElementById('toast');

// ========== Language Functions ==========
function t(key) {
    const lang = document.getElementById('language').value;
    return (translations[lang] && translations[lang][key]) || translations['en-US'][key] || key;
}

function getSupportedLanguage(lang) {
    if (translations[lang]) return lang;
    const mainLang = lang.split('-')[0];
    for (const key in translations) {
        if (key.startsWith(mainLang)) return key;
    }
    return 'en-US';
}

function changeLanguage() {
    const lang = document.getElementById('language').value;
    if (!translations[lang]) {
        document.getElementById('language').value = 'en-US';
        return changeLanguage();
    }
    localStorage.setItem('preferred_language', lang);
    renderState(); // Re-render current state with new language
}

// ========== Toast ==========
function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => {
        toast.classList.remove('show');
    }, 3000);
}

// ========== Dialogue Bubble Typewriter ==========
// Bumped by every new line, so a line still typing (and its callback) stops when replaced.
// Without it, a scan that answers mid-"Scanning..." interleaves both lines in the bubble.
let dialogueId = 0;

function showDialogue(text, callback) {
    const id = ++dialogueId;
    const bubble = document.getElementById('dialogueBubble');
    bubble.textContent = '';
    momoFace.setEmotion('speaking');

    let i = 0;
    function type() {
        if (id !== dialogueId) return;
        if (i < text.length) {
            bubble.textContent += text.charAt(i);
            i++;
            setTimeout(type, 30);
        } else {
            // Finish speaking, switch to curious
            setTimeout(() => {
                if (id !== dialogueId) return;
                momoFace.setEmotion('curious');
                if (callback) callback();
            }, 500);
        }
    }
    type();
}

function clearDialogue() {
    dialogueId++;
    const bubble = document.getElementById('dialogueBubble');
    bubble.textContent = '';
}

// ========== Typing Effect ==========
function typeText(element, text, callback) {
    element.textContent = text;
    // Callback is called immediately since we're not doing typing animation anymore
    if (callback) {
        callback();
    }
}

// ========== Render State ==========
function renderState() {
    dialogArea.innerHTML = '';

    switch (currentState) {
        case STATE.MAIN_MENU:
            renderMainMenu();
            break;
        case STATE.SCANNING:
            renderScanning();
            break;
        case STATE.SELECT_NETWORK:
            renderSelectNetwork();
            break;
        case STATE.CONFIRM_CONNECT:
            renderConfirmConnect();
            break;
        case STATE.ENTER_PASSWORD:
            renderEnterPassword();
            break;
        case STATE.CONNECTING:
            renderConnecting();
            break;
        case STATE.SUCCESS:
            renderSuccess();
            break;
        case STATE.FAILED:
            renderFailed();
            break;
        case STATE.SAVED_LIST_DELETE:
            renderDeleteSaved();
            break;
        case STATE.SAVED_LIST_DEFAULT:
            renderSetDefault();
            break;
        case STATE.CONFIRM_DELETE:
            renderConfirmDelete();
            break;
        case STATE.ADVANCED:
            renderAdvanced();
            break;
    }
}

function renderMainMenu() {
    clearDialogue();
    dialogArea.innerHTML = '';

    // Show welcome message in dialogue bubble with typewriter effect
    showDialogue(t('welcome'), () => {
        // After dialogue finishes, wait 1s then show options
        setTimeout(() => {
            const dialogText = document.createElement('div');
            dialogText.className = 'dialog-text fade-in-up';
            dialogArea.appendChild(dialogText);

            typeText(dialogText, t('select_action'), () => {
                const options = document.createElement('div');
                options.className = 'options';
                dialogArea.appendChild(options);

                const buttons = [
                    { text: t('connect_wifi'), primary: true, action: () => {
                        currentState = STATE.SCANNING;
                        renderState();
                        startAPRefresh();
                    }},
                    { text: t('delete_saved'), action: () => {
                        currentState = STATE.SAVED_LIST_DELETE;
                        loadSavedList();
                    }},
                    { text: t('set_default'), action: () => {
                        currentState = STATE.SAVED_LIST_DEFAULT;
                        loadSavedList();
                    }}
                ];

                buttons.forEach((btn, index) => {
                    setTimeout(() => {
                        const button = document.createElement('button');
                        button.className = 'option-btn fade-in' + (btn.primary ? ' primary' : '');
                        button.textContent = btn.text;
                        button.onclick = btn.action;
                        options.appendChild(button);
                    }, index * 200);
                });

                setTimeout(() => {
                    // A tap on an option before this fires has already left the menu
                    if (!options.isConnected) return;
                    const advancedLink = document.createElement('div');
                    advancedLink.className = 'advanced-link fade-in';
                    const link = document.createElement('a');
                    link.href = '#';
                    link.textContent = t('advanced');
                    link.onclick = (event) => {
                        event.preventDefault();
                        currentState = STATE.ADVANCED;
                        renderState();
                    };
                    advancedLink.appendChild(link);
                    dialogArea.appendChild(advancedLink);
                }, buttons.length * 200);
            });
        }, 1000);
    });
}

function renderScanning() {
    clearDialogue();
    dialogArea.innerHTML = '';

    // Show scanning message in dialogue bubble
    showDialogue(t('scanning'), () => {
        // After dialogue finishes, switch to loading emotion
        momoFace.setEmotion('loading');

        const scanning = document.createElement('div');
        scanning.className = 'scanning';
        dialogArea.appendChild(scanning);
    });
}

function renderSelectNetwork() {
    clearDialogue();
    dialogArea.innerHTML = '';

    // Show select network message in dialogue bubble
    showDialogue(t('select_network'), () => {
        // Create network list container (will be populated by updateNetworkList)
        const networkList = document.createElement('div');
        networkList.className = 'network-list';
        dialogArea.appendChild(networkList);

        // Create back button
        const backBtn = document.createElement('button');
        backBtn.className = 'option-btn fade-in';
        backBtn.textContent = t('back');
        backBtn.style.marginTop = '12px';
        backBtn.onclick = () => {
            stopAPRefresh();
            currentState = STATE.MAIN_MENU;
            renderState();
        };
        dialogArea.appendChild(backBtn);

        // Populate the network list
        updateNetworkList();
    });
}

function renderConfirmConnect() {
    clearDialogue();
    dialogArea.innerHTML = '';

    const message = `${t('no_password_needed')} ${t('confirm_connect')} "${selectedNetwork}"`;
    showDialogue(message, () => {
        const options = document.createElement('div');
        options.className = 'options';
        dialogArea.appendChild(options);

        const buttons = [
            { text: t('yes'), primary: true, action: () => connectToNetwork('') },
            { text: t('no'), action: () => {
                currentState = STATE.SELECT_NETWORK;
                renderState();
            }}
        ];

        buttons.forEach((btn, index) => {
            setTimeout(() => {
                const button = document.createElement('button');
                button.className = 'option-btn fade-in' + (btn.primary ? ' primary' : '');
                button.textContent = btn.text;
                button.onclick = btn.action;
                options.appendChild(button);
            }, index * 200);
        });
    });
}

function renderEnterPassword() {
    clearDialogue();
    dialogArea.innerHTML = '';

    const message = `${t('enter_password')} "${selectedNetwork}"`;
    showDialogue(message, () => {
        const inputGroup = document.createElement('div');
        inputGroup.className = 'input-group';
        inputGroup.style.marginTop = '16px';

        const label = document.createElement('label');
        label.textContent = t('password');
        inputGroup.appendChild(label);

        const passwordInput = document.createElement('input');
        passwordInput.type = 'password';
        passwordInput.id = 'passwordInput';
        passwordInput.placeholder = t('password');
        inputGroup.appendChild(passwordInput);

        dialogArea.appendChild(inputGroup);

        const options = document.createElement('div');
        options.className = 'options';
        dialogArea.appendChild(options);

        const buttons = [
            { text: t('connect'), primary: true, action: () => {
                const password = document.getElementById('passwordInput').value;
                connectToNetwork(password);
            }},
            { text: t('back'), action: () => {
                currentState = STATE.SELECT_NETWORK;
                renderState();
            }}
        ];

        buttons.forEach((btn, index) => {
            setTimeout(() => {
                const button = document.createElement('button');
                button.className = 'option-btn fade-in' + (btn.primary ? ' primary' : '');
                button.textContent = btn.text;
                button.onclick = btn.action;
                options.appendChild(button);
                if (index === 0) {
                    setTimeout(() => passwordInput.focus(), 100);
                }
            }, index * 200);
        });
    });
}

function renderConnecting() {
    momoFace.setEmotion('loading');
    clearDialogue();
    dialogArea.innerHTML = '';

    // Show connecting message in dialogue bubble
    const bubble = document.getElementById('dialogueBubble');
    bubble.textContent = t('connecting');
}

function renderSuccess() {
    momoFace.setEmotion('excited');
    clearDialogue();
    dialogArea.innerHTML = '';

    showDialogue(t('success'), () => {
        // Stay excited after talking
        momoFace.setEmotion('excited');
        setTimeout(() => {
            fetch('/exit', { method: 'POST' });
        }, 1500);
    });
}

function renderFailed() {
    momoFace.setEmotion('confused');
    clearDialogue();
    dialogArea.innerHTML = '';

    showDialogue(t('failed'), () => {
        // Wait 2 seconds then automatically go back
        setTimeout(() => {
            currentState = STATE.ENTER_PASSWORD;
            renderState();
        }, 2000);
    });
}

function renderDeleteSaved() {
    clearDialogue();
    dialogArea.innerHTML = '';

    showDialogue(t('delete_title'), () => {
        if (savedNetworks.length === 0) {
            const noSaved = document.createElement('div');
            noSaved.className = 'dialog-text';
            noSaved.style.fontSize = '14px';
            noSaved.style.color = 'var(--text-muted)';
            noSaved.textContent = t('no_saved');
            dialogArea.appendChild(noSaved);
        } else {
            const list = document.createElement('div');
            list.className = 'saved-wifi-list';

            savedNetworks.forEach((ssid, index) => {
                const item = document.createElement('div');
                item.className = 'saved-item';
                item.style.cursor = 'pointer';

                const name = document.createElement('span');
                name.textContent = ssid;
                item.appendChild(name);

                item.onclick = () => {
                    deleteIndex = index;
                    currentState = STATE.CONFIRM_DELETE;
                    renderState();
                };

                list.appendChild(item);
            });

            dialogArea.appendChild(list);
        }

        const backBtn = document.createElement('button');
        backBtn.className = 'option-btn fade-in';
        backBtn.textContent = t('back');
        backBtn.style.marginTop = '12px';
        backBtn.onclick = () => {
            currentState = STATE.MAIN_MENU;
            renderState();
        };
        dialogArea.appendChild(backBtn);
    });
}

function renderSetDefault() {
    clearDialogue();
    dialogArea.innerHTML = '';

    showDialogue(t('set_default_title'), () => {
        if (savedNetworks.length === 0) {
            const noSaved = document.createElement('div');
            noSaved.className = 'dialog-text';
            noSaved.style.fontSize = '14px';
            noSaved.style.color = 'var(--text-muted)';
            noSaved.textContent = t('no_saved');
            dialogArea.appendChild(noSaved);
        } else {
            const list = document.createElement('div');
            list.className = 'saved-wifi-list';

            savedNetworks.forEach((ssid, index) => {
                const item = document.createElement('div');
                item.className = 'saved-item';

                const name = document.createElement('span');
                name.textContent = ssid;
                item.appendChild(name);

                if (index === 0) {
                    const defaultBadge = document.createElement('span');
                    defaultBadge.style.fontSize = '12px';
                    defaultBadge.style.color = 'var(--accent)';
                    defaultBadge.textContent = '(Default)';
                    item.appendChild(defaultBadge);
                    item.style.opacity = '0.6';
                    item.style.cursor = 'default';
                } else {
                    item.style.cursor = 'pointer';
                    item.onclick = () => setDefaultNetwork(index);
                }

                list.appendChild(item);
            });

            dialogArea.appendChild(list);
        }

        const backBtn = document.createElement('button');
        backBtn.className = 'option-btn fade-in';
        backBtn.textContent = t('back');
        backBtn.style.marginTop = '12px';
        backBtn.onclick = () => {
            currentState = STATE.MAIN_MENU;
            renderState();
        };
        dialogArea.appendChild(backBtn);
    });
}

function renderConfirmDelete() {
    clearDialogue();
    dialogArea.innerHTML = '';

    const ssid = savedNetworks[deleteIndex];

    showDialogue(t('confirm_delete'), () => {
        momoFace.setEmotion('confused');

        const networkName = document.createElement('div');
        networkName.className = 'dialog-text';
        networkName.style.fontSize = '16px';
        networkName.style.marginTop = '8px';
        networkName.textContent = `"${ssid}"`;
        dialogArea.appendChild(networkName);

        const options = document.createElement('div');
        options.className = 'options';
        dialogArea.appendChild(options);

        const buttons = [
            { text: t('delete'), danger: true, action: () => deleteNetwork(deleteIndex) },
            { text: t('no'), action: () => {
                deleteIndex = null;
                currentState = STATE.SAVED_LIST_DELETE;
                renderState();
            }}
        ];

        buttons.forEach((btn, index) => {
            setTimeout(() => {
                const button = document.createElement('button');
                button.className = 'option-btn fade-in' + (btn.danger ? ' danger' : '');
                button.textContent = btn.text;
                button.onclick = btn.action;
                options.appendChild(button);
            }, index * 200);
        });
    });
}

function renderAdvanced() {
    clearDialogue();
    dialogArea.innerHTML = '';
    const renderId = ++advancedRenderId;

    showDialogue(t('advanced'), async () => {
        const config = await loadAdvancedConfig();
        // A language switch re-renders while the request is in flight; only the latest render draws
        if (renderId !== advancedRenderId || currentState !== STATE.ADVANCED) return;

        const error = document.createElement('div');
        error.className = 'error-message';

        const buttons = [];
        if (config) {
            appendAdvancedForm(config, error, buttons);
        } else {
            // Saving defaults over settings we could not read would wipe them, so offer only Back
            momoFace.setEmotion('confused');
            error.textContent = t('settings_failed');
        }
        dialogArea.appendChild(error);

        buttons.push({ text: t('back'), action: () => {
            currentState = STATE.MAIN_MENU;
            renderState();
        }});

        const options = document.createElement('div');
        options.className = 'options';
        dialogArea.appendChild(options);

        buttons.forEach((btn, index) => {
            setTimeout(() => {
                const button = document.createElement('button');
                button.className = 'option-btn fade-in' + (btn.primary ? ' primary' : '');
                button.textContent = btn.text;
                button.onclick = btn.action;
                options.appendChild(button);
            }, index * 200);
        });
    });
}

function appendAdvancedForm(config, error, buttons) {
    let otaInput = null;
    if (config.show_ota_config) {
        const group = document.createElement('div');
        group.className = 'input-group fade-in';
        group.style.marginTop = '16px';

        const label = document.createElement('label');
        label.htmlFor = 'otaUrlInput';
        label.textContent = t('ota_url');
        group.appendChild(label);

        otaInput = document.createElement('input');
        otaInput.type = 'url';
        otaInput.id = 'otaUrlInput';
        otaInput.maxLength = 255; // The device reads ota_url back into a 256-byte buffer
        otaInput.autocomplete = 'off';
        otaInput.spellcheck = false;
        otaInput.setAttribute('autocapitalize', 'off');
        otaInput.value = config.ota_url || '';
        group.appendChild(otaInput);

        dialogArea.appendChild(group);
    }

    const powerGroup = document.createElement('div');
    powerGroup.className = 'input-group fade-in';

    const powerLabel = document.createElement('label');
    powerLabel.htmlFor = 'txPowerSelect';
    powerLabel.textContent = t('max_tx_power');
    powerGroup.appendChild(powerLabel);

    const powerSelect = document.createElement('select');
    powerSelect.id = 'txPowerSelect';
    const powerOptions = TX_POWER_OPTIONS.slice();
    const currentPower = config.max_tx_power;
    const validPower = Number.isInteger(currentPower) && currentPower >= 8 && currentPower <= 84;
    if (validPower && !powerOptions.some(([value]) => value === currentPower)) {
        powerOptions.push([currentPower, `${currentPower / 4} dBm`]);
        powerOptions.sort((a, b) => a[0] - b[0]);
    }
    powerOptions.forEach(([value, text]) => {
        const option = document.createElement('option');
        option.value = String(value);
        option.textContent = text;
        powerSelect.appendChild(option);
    });
    // An unknown current power stays unselected and is left out of the save
    powerSelect.value = validPower ? String(currentPower) : '';
    powerGroup.appendChild(powerSelect);
    dialogArea.appendChild(powerGroup);

    const bssidInput = appendCheckbox('rememberBssidInput', t('remember_bssid'), config.remember_bssid);
    const sleepInput = config.show_sleep_config
        ? appendCheckbox('sleepModeInput', t('sleep_mode'), config.sleep_mode)
        : null;

    buttons.push({ text: t('save'), primary: true, action: (event) => {
        // Hidden fields are omitted so the device keeps their stored values
        const payload = { remember_bssid: bssidInput.checked };
        if (powerSelect.value !== '') payload.max_tx_power = parseInt(powerSelect.value, 10);
        if (otaInput) payload.ota_url = otaInput.value.trim();
        if (sleepInput) payload.sleep_mode = sleepInput.checked;
        saveAdvancedConfig(payload, event.currentTarget, error);
    }});
}

function appendCheckbox(id, text, checked) {
    const group = document.createElement('div');
    group.className = 'checkbox-group fade-in';

    const label = document.createElement('label');
    label.htmlFor = id;
    label.textContent = text;
    group.appendChild(label);

    const input = document.createElement('input');
    input.type = 'checkbox';
    input.id = id;
    input.checked = Boolean(checked);
    group.appendChild(input);

    dialogArea.appendChild(group);
    return input;
}

// ========== API Functions ==========
async function connectToNetwork(password) {
    currentState = STATE.CONNECTING;
    renderState();

    const payload = {
        ssid: selectedNetwork,
        password: password
    };

    try {
        const response = await fetch('/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (data.success) {
            currentState = STATE.SUCCESS;
            renderState();
        } else {
            throw new Error(data.error || 'Connection failed');
        }
    } catch (err) {
        currentState = STATE.FAILED;
        renderState();
    }
}

async function loadSavedList() {
    try {
        const response = await fetch('/saved/list');
        savedNetworks = await response.json();
        renderState();
    } catch (err) {
        console.error('Error loading saved list:', err);
    }
}

async function deleteNetwork(index) {
    try {
        await fetch(`/saved/delete?index=${index}`, { method: 'GET' });
        showToast(t('deleted'));
        deleteIndex = null;
        currentState = STATE.SAVED_LIST_DELETE;
        await loadSavedList();
    } catch (err) {
        console.error('Error deleting network:', err);
    }
}

async function setDefaultNetwork(index) {
    try {
        await fetch(`/saved/set_default?index=${index}`, { method: 'GET' });
        showToast(t('default_set'));
        await loadSavedList();
    } catch (err) {
        console.error('Error setting default:', err);
    }
}

async function loadAdvancedConfig() {
    try {
        const response = await fetch('/advanced/config');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
    } catch (err) {
        console.error('Error loading advanced config:', err);
        return null;
    }
}

async function saveAdvancedConfig(payload, saveButton, error) {
    saveButton.disabled = true;
    error.textContent = '';

    try {
        const response = await fetch('/advanced/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        // The device answers errors with plain text, which fails to parse here
        const data = await response.json();
        if (!data.success) throw new Error(data.error || 'Save failed');

        showToast(t('config_success'));
        currentState = STATE.MAIN_MENU;
        renderState();
    } catch (err) {
        console.error('Error saving advanced config:', err);
        momoFace.setEmotion('confused');
        error.textContent = t('settings_failed');
        saveButton.disabled = false;
    }
}

async function loadAPList() {
    try {
        const response = await fetch('/scan');
        const data = await response.json();
        support5G = data.support_5g;
        apList = data.aps;

        // If we're scanning, transition to showing the network list
        if (currentState === STATE.SCANNING) {
            currentState = STATE.SELECT_NETWORK;
            renderState();
        }
        // If we're already showing the network list, just update it
        else if (currentState === STATE.SELECT_NETWORK) {
            updateNetworkList();
        }
    } catch (err) {
        console.error('Error loading AP list:', err);
    }
}

function updateNetworkList() {
    // Find or create the network list container
    let networkList = dialogArea.querySelector('.network-list');

    if (!networkList) {
        // If network list doesn't exist, create it
        networkList = document.createElement('div');
        networkList.className = 'network-list';

        // Insert it before the back button if it exists
        const backBtn = dialogArea.querySelector('.option-btn');
        if (backBtn) {
            dialogArea.insertBefore(networkList, backBtn);
        } else {
            dialogArea.appendChild(networkList);
        }
    }

    // Add a subtle flash effect to indicate refresh
    networkList.style.transition = 'opacity 0.15s';
    networkList.style.opacity = '0.5';

    setTimeout(() => {
        // Clear and rebuild the list
        networkList.innerHTML = '';

        if (apList.length === 0) {
            const scanning = document.createElement('div');
            scanning.className = 'scanning';
            networkList.appendChild(scanning);
            networkList.style.opacity = '1';
            return;
        }

        apList.forEach(ap => {
            const item = document.createElement('div');
            item.className = 'network-item';

            const info = document.createElement('div');
            info.className = 'network-info';

            const name = document.createElement('div');
            name.className = 'network-name';
            name.textContent = ap.ssid;

            const signal = document.createElement('div');
            signal.className = 'network-signal';
            signal.textContent = `${ap.rssi} dBm`;

            info.appendChild(name);
            info.appendChild(signal);

            const icon = document.createElement('div');
            icon.className = 'network-icon';
            if (ap.authmode === 0) {
                icon.textContent = '🌐';
            } else {
                icon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="-5.0 -10.0 110.0 135.0" style="width: 40px; height: 40px;"><path d="m70 45.715v-17.145c0-11.027-8.9727-20-20-20s-20 8.9727-20 20v17.145c-6.3008 0-11.43 5.1289-11.43 11.43v22.855c0 6.3008 5.1289 11.43 11.43 11.43h40c6.3008 0 11.43-5.1289 11.43-11.43v-22.855c0-6.3008-5.1289-11.43-11.43-11.43zm-34.285-17.145c0-7.875 6.4102-14.285 14.285-14.285s14.285 6.4102 14.285 14.285v17.145h-28.57zm40 51.43c0 3.1523-2.5625 5.7148-5.7148 5.7148h-40c-3.1523 0-5.7148-2.5625-5.7148-5.7148v-22.855c0-3.1523 2.5625-5.7148 5.7148-5.7148h40c3.1523 0 5.7148 2.5625 5.7148 5.7148zm-22.859-17.145v11.43c0 1.5781-1.2773 2.8555-2.8555 2.8555s-2.8555-1.2773-2.8555-2.8555v-11.43c0-1.5781 1.2773-2.8555 2.8555-2.8555s2.8555 1.2773 2.8555 2.8555z" fill="#888"/></svg>';
            }

            item.appendChild(info);
            item.appendChild(icon);

            item.onclick = () => {
                selectedNetwork = ap.ssid;
                selectedNetworkAuth = ap.authmode;
                if (ap.authmode === 0) {
                    currentState = STATE.CONFIRM_CONNECT;
                } else {
                    currentState = STATE.ENTER_PASSWORD;
                }
                renderState();
            };

            networkList.appendChild(item);
        });

        // Restore opacity
        networkList.style.opacity = '1';
    }, 150);
}

function startAPRefresh() {
    loadAPList();
    stopAPRefresh();
    refreshInterval = setInterval(loadAPList, 5000);
}

function stopAPRefresh() {
    if (refreshInterval) {
        clearInterval(refreshInterval);
        refreshInterval = null;
    }
}

// ========== Initialization ==========
document.addEventListener('DOMContentLoaded', () => {
    // Initialize MomoFace
    const momoSvg = document.getElementById('momoFace');
    momoFace = new MomoFace(momoSvg);

    // Get language setting
    const urlParams = new URLSearchParams(window.location.search);
    const langParam = urlParams.get('lang');
    const browserLang = navigator.language || navigator.userLanguage;
    const savedLang = langParam || localStorage.getItem('preferred_language') || getSupportedLanguage(browserLang);

    document.getElementById('language').value = savedLang;

    // Start at main menu
    currentState = STATE.MAIN_MENU;
    renderState();
});

window.addEventListener('pageshow', () => {
    if (currentState === STATE.SAVED_LIST_DELETE || currentState === STATE.SAVED_LIST_DEFAULT) {
        loadSavedList();
    }
});

window.addEventListener('pagehide', () => {
    stopAPRefresh();
});
    </script>
